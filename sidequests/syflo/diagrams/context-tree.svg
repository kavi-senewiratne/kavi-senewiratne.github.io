<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="t d">
  <title id="t">What a branch sends to the model</title>
  <desc id="d">A tree of four chats. The main chat about the paper is sent as a summary. Its child, the attention chat, is sent in full. The grandchild, why several heads, is where you are typing. The sibling branch GPU memory is not sent at all.</desc>

  <style>
    /* Blueprint palette of kavi-senewiratne.github.io: one blue #2456a6. */
    .plate  { fill: #ffffff; }
    .line   { stroke: #b9c4d6; stroke-width: 1.5; fill: none; }
    .box    { fill: #fbfbf9; stroke: #b9c4d6; stroke-width: 1.5; }
    .box-on { fill: #e8eef8; stroke: #2456a6; stroke-width: 2; }
    .box-off{ fill: none;    stroke: #ccd3de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .label  { fill: #182236; font: 500 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .label-off { fill: #98a1b0; font: 500 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag    { fill: #2456a6; font: 600 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em; }
    .tag-mut{ fill: #98a1b0; font: 600 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em; }
    .foot   { fill: #5c6778; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .rule   { stroke: #dde1e6; stroke-width: 1; }
  </style>

  <rect class="plate" x="0" y="0" width="700" height="400" rx="3"/>

  <!-- trunk from root down to GPU memory -->
  <path class="line" d="M 62 84 L 62 338"/>
  <path class="line" d="M 62 154 L 92 154"/>
  <path class="line" d="M 62 338 L 92 338"/>
  <!-- branch from attention down to why several heads -->
  <path class="line" d="M 114 176 L 114 246 L 144 246"/>

  <!-- root -->
  <rect class="box" x="32" y="30" width="252" height="54" rx="3"/>
  <text class="label" x="52" y="62">main chat: the paper</text>
  <text class="tag" x="316" y="62">sent as a short summary</text>

  <!-- attention -->
  <rect class="box" x="92" y="128" width="216" height="54" rx="3"/>
  <text class="label" x="112" y="160">attention</text>
  <text class="tag" x="340" y="160">sent in full</text>

  <!-- why several heads -->
  <rect class="box-on" x="144" y="220" width="240" height="54" rx="3"/>
  <text class="label" x="164" y="252">why several heads?</text>
  <text class="tag" x="416" y="252">you are typing here</text>

  <!-- GPU memory -->
  <rect class="box-off" x="92" y="312" width="216" height="54" rx="3"/>
  <text class="label-off" x="112" y="344">GPU memory</text>
  <text class="tag-mut" x="340" y="344">not sent at all</text>

  <!-- footnote -->
  <line class="rule" x1="144" y1="288" x2="556" y2="288"/>
  <text class="foot" x="144" y="306">…plus the words you branched on. The sibling branch stays out.</text>
</svg>
